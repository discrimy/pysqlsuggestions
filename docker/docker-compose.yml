# Development backends for integration tests and the web demo.
#
# The schema mirrors report_service, the first consumer: its own Django tables in
# Postgres, the analytics tables its ClickHouse reports read, and Trino pointed at
# both. Trino is deliberately not seeded — its catalogs federate the other two, so
# `postgresql.public.reports_report` and `clickhouse.analytics.report_executions`
# exercise the three-level namespace against real data.
#
#   docker compose -f docker/docker-compose.yml up --wait
#
# Ports are offset to avoid colliding with anything already running locally.

name: pysqlsuggestions

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: report_service
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report
    ports:
      - '57432:5432'
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U report -d report_service']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '57379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: report
      CLICKHOUSE_PASSWORD: report
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '57123:8123'
      - '57900:9000'
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--user', 'report', '--password', 'report', '--query', 'SELECT 1']
      interval: 2s
      timeout: 5s
      retries: 30

  trino:
    image: trinodb/trino:468
    # Trino's jvm.config sets -XX:MaxRAMPercentage=80, which without a limit here
    # means 80% of *host* RAM. Cap it so the JVM sizes its heap off the cgroup.
    mem_limit: 8g
    ports:
      - '57080:8080'
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'trino', '--execute', 'SELECT 1']
      interval: 5s
      timeout: 10s
      retries: 40

  # A self-signed PKCS12 for `trino-secure`, made once into a named volume.
  #
  # keytool rather than openssl, and the Trino image rather than a new one: it
  # can write a self-signed certificate straight into a keystore in a single
  # command, so this needs no tool the fixture did not already pin a version of.
  # The key never leaves the volume and is regenerated on `down -v`, which is
  # why there is no certificate committed to this repository.
  trino-tls-init:
    image: trinodb/trino:468
    user: root
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        test -f /tls/keystore.p12 ||
        keytool -genkeypair -alias trino -keyalg RSA -keysize 2048 -validity 365
        -storetype PKCS12 -keystore /tls/keystore.p12 -storepass trinotest
        -dname CN=localhost -ext SAN=dns:localhost,ip:127.0.0.1
        && chmod 644 /tls/keystore.p12
    volumes:
      - trino-tls:/tls

  # Trino with TLS and password authentication, for the reader's auth tests.
  #
  # A second coordinator rather than a flag on the first: PASSWORD authentication
  # makes Trino refuse plain HTTP, so one server cannot be both the
  # unauthenticated fixture the catalog tests use and the authenticated one these
  # need. It federates nothing — `tpch` only — so it waits on no other service.
  trino-secure:
    image: trinodb/trino:468
    mem_limit: 4g
    ports:
      - '57443:8443'
    volumes:
      - ./trino/secure-catalog:/etc/trino/catalog:ro
      - ./trino/secure/config.properties:/etc/trino/config.properties:ro
      - ./trino/secure/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/secure/password.db:/etc/trino/password.db:ro
      - trino-tls:/etc/trino/tls:ro
    depends_on:
      trino-tls-init:
        condition: service_completed_successfully
    healthcheck:
      # Unauthenticated on purpose: /v1/info answers without credentials, so this
      # reports whether the coordinator is up without also asserting that
      # authentication works — which is the tests' job, not the fixture's.
      test: ['CMD', 'curl', '-fsk', 'https://localhost:8443/v1/info']
      interval: 5s
      timeout: 10s
      retries: 40

volumes:
  trino-tls:
