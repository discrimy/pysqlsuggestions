# A coordinator with TLS and password authentication, for the reader's auth tests.
#
# Separate from the main `trino` service rather than an addition to it: enabling
# PASSWORD authentication makes Trino refuse plain HTTP, so one server cannot be
# both the unauthenticated fixture the catalog tests use and the authenticated
# one these need.
#
# Deliberately federating nothing. It carries `tpch` alone, so it does not wait
# on Postgres or ClickHouse and a failure here is never a failure of theirs.
coordinator=true
node-scheduler.include-coordinator=true
catalog.management=static

# Kept on loopback for Trino's own discovery. Nothing outside the container
# reaches it, and with PASSWORD authentication set Trino refuses it anyway.
http-server.http.port=8080
discovery.uri=http://localhost:8080

http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/keystore.p12
http-server.https.keystore.key=trinotest

http-server.authentication.type=PASSWORD
internal-communication.shared-secret=pysqlsuggestions-fixture-not-a-secret
