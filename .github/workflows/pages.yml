name: demo

# Publishes the browser demo to GitHub Pages.
#
# No database and no server: Pages serves files only, so the page loads the
# library under Pyodide and completes against `demo/schema.py`, a schema
# invented for the demo and carried as data. That is why this job needs no
# services — and why nothing here can reach a real database, which is the point.
#
# A tag is what publishes. The page installs a wheel of this library, so what
# the demo shows is one released version's behaviour and not whatever main
# reached this morning — someone reporting that the demo misbehaves can say
# which version misbehaved. `workflow_dispatch` remains for republishing the
# same tag when the deploy, rather than the build, is what failed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wheel takes its version from pyproject.toml, never from the tag. Tag
      # v0.1.1 on a tree that still reads 0.1.0 and the demo publishes under one
      # version while running another — a disagreement nothing downstream can
      # see, and the demo is where a version claim gets read most casually.
      - name: The tag and the package agree on the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 "^version = " pyproject.toml | cut -d"'" -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $version"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the wheel the page installs
        run: uv build --wheel

      - name: Assemble site/
        run: uv run --no-project python scripts/build_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
