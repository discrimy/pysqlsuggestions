[project]
name = 'pysqlsuggestions-lsp'
version = '0.7.0'
description = 'A language server over pysqlsuggestions'
requires-python = '>=3.10'
dependencies = [
    'pysqlsuggestions==0.7.0',
    # 2.x, not 1.x: the two differ in how features are registered and in what a
    # handler receives, and `server.py` is written against 2.x. A floor that
    # admitted 1.x would install cleanly and fail at the first keystroke.
    'pygls>=2.1',
]

# Named after the driver, not the backend, following the library's own extras.
# The extension bundles these two because both are pure Python and so one VSIX
# serves every platform; psycopg2 stays the documented choice for library users.
[project.optional-dependencies]
pg8000 = ['pg8000>=1.30']
trino = ['trino>=0.328']

[project.scripts]
pysqlsuggestions-lsp = 'pysqlsuggestions_lsp.__main__:main'

# The library is the workspace root, so a checkout builds against the tree it
# sits in rather than whatever PyPI last published. The `==` pin above is what a
# released wheel carries; this is what a developer gets.
[tool.uv.sources]
pysqlsuggestions = { workspace = true }

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['pysqlsuggestions_lsp']
