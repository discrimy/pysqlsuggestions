[project]
name = 'pysqlsuggestions'
version = '0.8.0'
description = 'Context-aware, schema-aware SQL completion as a library'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []
license = { file = 'LICENSE' }
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Database',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Typing :: Typed',
]

# `Homepage` rather than `GitHub`: PyPI recognises the label, renders it with an
# icon and sorts it first. `Demo` is shown as written, which is what it should
# say — and the URL is the one `.github/workflows/pages.yml` already deploys to,
# so the two cannot drift without the demo itself moving.
[project.urls]
Homepage = 'https://github.com/discrimy/pysqlsuggestions'
Demo = 'https://discrimy.github.io/pysqlsuggestions/'

# Extras are named after the driver they install, not the backend: more than one
# driver can serve the same backend, so a future psycopg3 extra sits alongside
# psycopg2 rather than silently changing what `postgres` means. Anything that is
# not a catalog driver is named for its role first — `demo` already was, without
# anybody writing the rule down — so `cache-redis` and a future `cache-valkey`
# are siblings the way `psycopg2` and `pg8000` are.
[project.optional-dependencies]
psycopg2 = ['psycopg2-binary>=2.9']
pg8000 = ['pg8000>=1.30']
clickhouse-driver = ['clickhouse-driver>=0.2.9']
trino = ['trino>=0.328']
cache-redis = ['redis>=3.0']
demo = ['fastapi>=0.110', 'uvicorn>=0.29']

[project.entry-points.'pysqlsuggestions.dialects']
ansi = 'pysqlsuggestions.dialects.ansi:ANSI'
postgres = 'pysqlsuggestions.dialects.postgres:POSTGRES'
clickhouse = 'pysqlsuggestions.dialects.clickhouse:CLICKHOUSE'
trino = 'pysqlsuggestions.dialects.trino:TRINO'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/pysqlsuggestions']

# The language server is a second distribution rather than a subpackage: it
# imports pygls and a driver, and `test_import_pulls_in_no_drivers` exists to
# keep both out of `import pysqlsuggestions`. Same tree, same version, separate
# wheel — which is also what lets the extension bundle one without the other.
[tool.uv.workspace]
members = ['lsp']

[tool.uv.sources]
pysqlsuggestions-lsp = { workspace = true }

[dependency-groups]
dev = [
    'pytest>=8.4',
    'pytest-cov>=7.0',
    'ruff>=0.14',
    'mypy>=1.7',
    'pre-commit>=3.5',
    # Integration tests and the demo only. The library itself imports none of these,
    # and tests/test_purity.py fails the build if that ever stops being true.
    'psycopg2-binary>=2.9',
    'clickhouse-driver>=0.2.9',
    'trino>=0.328',
    'fastapi>=0.110',
    'uvicorn>=0.29',
    # The cache adapter's own tests: fakeredis for the fast suite, the real
    # client for the one integration test that needs a server to be unpluggable.
    'redis>=3.0',
    'fakeredis>=2.21',
    # The language server and the pure-Python driver the extension bundles.
    'pysqlsuggestions-lsp',
    'pg8000>=1.30',
]

[tool.ruff]
line-length = 120
src = ['src', 'tests', 'lsp']
# ruff formats Python code blocks inside Markdown; the design docs are prose and
# their snippets are illustrative, so keep it away from them.
extend-exclude = ['*.md']

[tool.ruff.lint]
select = ['A', 'B', 'BLE', 'C4', 'COM', 'D', 'E', 'F', 'G', 'I', 'PT', 'Q', 'RET', 'RSE', 'SIM', 'T20', 'UP', 'W']
ignore = [
    'A003', 'COM812', 'D100', 'D104', 'D105', 'D106', 'D107', 'D203', 'D205', 'D212', 'D4', 'PT009', 'RET504',
    # Reserved-word and keyword sets are word lists. A 100-entry list literal at one
    # word per line is unreadable; a whitespace-split block reads like the docs it came from.
    'SIM905',
]

[tool.ruff.lint.per-file-ignores]
# A developer script that reports what it did.
'scripts/*' = ['T201']

[tool.ruff.lint.isort]
known-first-party = ['pysqlsuggestions', 'pysqlsuggestions_lsp', 'scripts', 'tests']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true
files = ['src', 'tests', 'lsp']

[[tool.mypy.overrides]]
module = ['demo.app']
follow_imports = 'skip'
# The demo is not in `files`, so it is not type-checked — but a test that
# imports it drags it in anyway, and this is the one demo module needing the
# web framework and the three real drivers. None of psycopg2, clickhouse_driver
# or trino ships stubs, so following it fails the gate over dependencies the
# library itself does not have. `demo/browser.py` and `demo/payload.py` import
# nothing outside the library and are still followed.

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['integration: needs the docker backends (docker/docker-compose.yml)']
