[project]
name = 'pysqlsuggestions'
version = '0.1.0.dev0'
description = 'Context-aware, schema-aware SQL completion as a library'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []
license = { text = 'MIT' }
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Database',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Typing :: Typed',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/pysqlsuggestions']

[dependency-groups]
dev = [
    'pytest>=8.4',
    'pytest-cov>=7.0',
    'ruff>=0.14',
    'mypy>=1.7',
    'pre-commit>=3.5',
]

[tool.ruff]
line-length = 120
src = ['src', 'tests']
# ruff formats Python code blocks inside Markdown; the design docs are prose and
# their snippets are illustrative, so keep it away from them.
extend-exclude = ['*.md']

[tool.ruff.lint]
select = ['A', 'B', 'BLE', 'C4', 'COM', 'D', 'E', 'F', 'G', 'I', 'PT', 'Q', 'RET', 'RSE', 'SIM', 'T20', 'UP', 'W']
ignore = ['A003', 'COM812', 'D100', 'D104', 'D105', 'D106', 'D107', 'D203', 'D205', 'D212', 'D4', 'PT009', 'RET504']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
strict = true
files = ['src', 'tests']

[tool.pytest.ini_options]
testpaths = ['tests']
